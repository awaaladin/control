name: Build APK

on:
  push:
    branches: [main]
    # Only rebuild the app when the app (or this workflow) changes.
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

# A newer push cancels the build that is still running.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needed to update the public download release below.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk

      # The website's "Download the Android app" button points at this release, so the
      # link never changes and always serves the newest build.
      - name: Publish APK to the download release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk pulse.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest pulse.apk \
            --target "$GITHUB_SHA" \
            --title "PULSE for Android (latest)" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Open the file after downloading and allow installing from this source once." \
            --latest
