[workspace]
resolver = "2"
members = ["crates/rhcs-core", "crates/netscan", "crates/zte", "crates/rhcs-cli", "crates/rhcsd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rhcs-core = { path = "crates/rhcs-core" }
netscan = { path = "crates/netscan" }
zte = { path = "crates/zte" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Small binaries matter: consumer routers have a few MB of flash.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
